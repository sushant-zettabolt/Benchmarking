[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbench"
version = "0.1.0"
description = "Endpoint-driven inference benchmark harness for llama.cpp-server and vLLM, under one measurement contract (docs/contract.md)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
llmbench = "llmbench.cli:main"

[tool.setuptools.packages.find]
include = ["llmbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
